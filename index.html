<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thomas Crawford</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f0e0d;
      --surface: #1a1916;
      --accent: #f0c040;
      --accent2: #e05a2b;
      --text: #f0ede6;
      --muted: #7a766e;
      --border: #2e2c28;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 15px;
      line-height: 1.7;
      cursor: crosshair;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
      opacity: 0.4;
    }

    .container { max-width: 780px; margin: 0 auto; padding: 0 2rem; }

    header {
      padding: 5rem 0 3rem;
      border-bottom: 1px solid var(--border);
      animation: fadeUp 0.7s ease both;
    }

    .tag {
      font-size: 11px;
      letter-spacing: 0.15em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(3rem, 8vw, 6rem);
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -0.02em;
      margin-bottom: 1.5rem;
    }

    h1 span {
      color: var(--accent);
      display: inline-block;
      animation: wobble 3s ease-in-out infinite;
    }

    .intro { max-width: 520px; color: var(--muted); font-size: 14px; margin-bottom: 2rem; }

    .contact-line { display: flex; flex-wrap: wrap; gap: 1.5rem; font-size: 12px; color: var(--muted); }

    .contact-line a {
      color: var(--muted);
      text-decoration: none;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1px;
      transition: color 0.2s, border-color 0.2s;
    }

    .contact-line a:hover { color: var(--accent); border-color: var(--accent); }

    section {
      padding: 3rem 0;
      border-bottom: 1px solid var(--border);
      animation: fadeUp 0.7s ease both;
    }

    section:nth-of-type(1) { animation-delay: 0.1s; }
    section:nth-of-type(2) { animation-delay: 0.2s; }
    section:nth-of-type(3) { animation-delay: 0.3s; }
    section:nth-of-type(4) { animation-delay: 0.4s; }
    section:nth-of-type(5) { animation-delay: 0.5s; }

    .section-label {
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent2);
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    h2 { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1.1rem; margin-bottom: 0.25rem; }

    .expand-wrap { margin-bottom: 1.5rem; }

    .expand-trigger {
      display: inline;
      cursor: pointer;
      border-bottom: 1px dashed var(--accent);
      color: var(--accent);
      transition: background 0.15s;
      padding: 0 2px;
    }

    .expand-trigger:hover { background: rgba(240,192,64,0.12); }

    .expand-trigger::after {
      content: ' ↓';
      font-size: 11px;
      opacity: 0.7;
      transition: transform 0.3s;
      display: inline-block;
    }

    .expand-trigger.open::after { content: ' ↑'; }

    .expand-content {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.35s ease;
      margin-top: 0;
    }

    .expand-content.open { grid-template-rows: 1fr; margin-top: 0.75rem; }

    .expand-inner {
      overflow: hidden;
      background: var(--surface);
      border-left: 2px solid var(--accent);
      padding: 0 1rem;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.8;
      border-radius: 0 4px 4px 0;
    }

    .expand-content.open .expand-inner { padding: 0.75rem 1rem; }

    .project { margin-bottom: 2rem; padding-bottom: 2rem; border-bottom: 1px solid var(--border); }
    .project:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }

    .project-meta { font-size: 11px; color: var(--muted); margin-bottom: 0.25rem; letter-spacing: 0.05em; }
    .project-title { font-family: 'Syne', sans-serif; font-size: 1.2rem; font-weight: 700; margin-bottom: 0.5rem; }
    .project-desc { font-size: 13px; color: var(--muted); margin-bottom: 0.75rem; }

    .skills-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }
    .skill-group h3 { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent2); margin-bottom: 0.5rem; }
    .skill-group ul { list-style: none; font-size: 13px; color: var(--muted); }
    .skill-group ul li::before { content: '— '; color: var(--border); }

    .job { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.25rem; }
    .job-title { font-size: 14px; font-weight: 500; }
    .job-date { font-size: 11px; color: var(--muted); font-style: italic; }

    footer {
      padding: 3rem 0;
      font-size: 12px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .social-links { display: flex; gap: 1.5rem; }
    .social-links a { color: var(--muted); text-decoration: none; transition: color 0.2s; }
    .social-links a:hover { color: var(--accent); }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes wobble { 0%, 100% { transform: rotate(-1deg); } 50% { transform: rotate(1deg); } }

    .cursor-dot {
      width: 6px; height: 6px;
      background: var(--accent);
      border-radius: 50%;
      position: fixed;
      pointer-events: none;
      z-index: 10000;
      transform: translate(-50%, -50%);
      transition: transform 0.1s;
    }

    .contact-box { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 1.5rem; }
    .contact-box p { color: var(--muted); font-size: 13px; margin-bottom: 1rem; }

    .contact-box a {
      display: inline-block;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      color: var(--accent);
      text-decoration: none;
      border: 1px solid var(--accent);
      padding: 0.5rem 1.25rem;
      border-radius: 3px;
      transition: background 0.2s, color 0.2s;
    }

    .contact-box a:hover { background: var(--accent); color: var(--bg); }

    .pill {
      display: inline-block;
      font-size: 11px;
      background: rgba(240,192,64,0.1);
      color: var(--accent);
      border: 1px solid rgba(240,192,64,0.25);
      border-radius: 999px;
      padding: 2px 10px;
      margin-right: 6px;
      margin-bottom: 6px;
    }

    #app-sections { display: contents; }

    /* ── MODE TOGGLE ── */
    .mode-toggle {
      display: flex;
      gap: 0.5rem;
      margin-top: 1.75rem;
    }

    .mode-btn {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.05em;
      color: var(--muted);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.5rem 1rem;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }

    .mode-btn:hover { color: var(--text); border-color: var(--muted); }

    .mode-btn.active {
      color: var(--bg);
      background: var(--accent);
      border-color: var(--accent);
    }

    .mode-hint {
      font-size: 11px;
      color: var(--muted);
      margin-top: 0.6rem;
      font-style: italic;
    }
  </style>
</head>
<body>

<div class="cursor-dot" id="dot"></div>

<div class="container">
  <header id="app-header"></header>
  <div id="app-sections"></div>
  <footer id="app-footer"></footer>
</div>

<!-- ================================================================
     RENDERING ENGINE — you shouldn't need to touch this.
     ================================================================ -->
<script>
  const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function expandTrigger(exp) {
    return `<span class="expand-trigger" onclick="toggle(this)">${esc(exp.label)}</span>` +
            `<span class="expand-content"><span class="expand-inner">${esc(exp.detail)}</span></span>`;
  }

  function renderHeader() {
    const s = SITE;
    document.getElementById('app-header').innerHTML = `
      <p class="tag">${esc(s.tag)}</p>
      <h1>${esc(s.name.first)}<br><span>${esc(s.name.last)}</span></h1>
      <p class="intro">${esc(s.intro)}</p>
      <div class="contact-line">
        <a href="mailto:${esc(s.contact.email)}">${esc(s.contact.email)}</a>
        <span>${esc(s.contact.phone)}</span>
        <span>${esc(s.contact.location)}</span>
      </div>
      <div class="mode-toggle">
        <button class="mode-btn" data-mode="skim" onclick="setMode('skim')">Skim it</button>
        <button class="mode-btn" data-mode="dig" onclick="setMode('dig')">Dig in</button>
      </div>
      <p class="mode-hint" id="mode-hint"></p>
    `;
  }

  function renderAbout() {
    const items = SITE.about.map(block => {
      // `text` can contain any number of {keyName} placeholders — every other
      // property on the block is treated as an expandable term keyed by that name.
      let html = esc(block.text).replace(/\n/g, '<br>');
      Object.keys(block).forEach(key => {
        if (key === 'text') return;
        const placeholder = `{${key}}`;
        if (html.includes(placeholder)) {
          html = html.replace(placeholder, expandTrigger(block[key]));
        }
      });
      return `<div class="expand-wrap"><p>${html}</p></div>`;
    }).join('');
    return section('About', items);
  }

  function renderProjects() {
    const items = SITE.engineeringProjects.map(p => `
      <div class="project">
        <p class="project-meta">${esc(p.meta)}</p>
        <h2 class="project-title"><span class="expand-trigger" onclick="toggle(this)">${esc(p.title)}</span></h2>
        <div class="expand-content"><div class="expand-inner">${esc(p.detail)}</div></div>
      </div>
    `).join('');
    return section('Engineering Projects', items);
  }

  function renderGames() {
    const g = SITE.games;
    const items = g.list.map(p => `
      <div class="project">
        <p class="project-meta">${esc(p.meta)}</p>
        <h2 class="project-title"><span class="expand-trigger" onclick="toggle(this)">${esc(p.title)}</span></h2>
        <div class="expand-content"><div class="expand-inner">${esc(p.detail)}</div></div>
      </div>
    `).join('');
    const intro = `<p style="color:var(--muted); font-size:13px; margin-bottom:2rem;">${esc(g.intro)}</p>`;
    const footnote = `<p style="color:var(--muted);font-size:12px;font-style:italic;">${esc(g.footnote)}</p>`;
    return section('Unreal Engine Games', intro + items + footnote);
  }

  function renderSkills() {
    const groups = SITE.skills.map(g => `
      <div class="skill-group">
        <h3>${esc(g.group)}</h3>
        <ul>${g.items.map(i => `<li>${esc(i)}</li>`).join('')}</ul>
      </div>
    `).join('');
    return section('Skills', `<div class="skills-grid">${groups}</div>`);
  }

  function renderContact() {
    const c = SITE.contactBox;
    const html = `
      <div class="contact-box">
        <p>${esc(c.text)}</p>
        <a href="mailto:${esc(SITE.contact.email)}">${esc(c.ctaLabel)}</a>
      </div>
    `;
    return section('Contact', html);
  }

  function section(label, innerHTML) {
    return `<section><p class="section-label">${esc(label)}</p>${innerHTML}</section>`;
  }

  function renderFooter() {
    const f = SITE.footer;
    const links = f.social.map(s => `<a href="${esc(s.url)}" target="_blank">${esc(s.label)}</a>`).join('');
    document.getElementById('app-footer').innerHTML = `
      <span>${esc(f.copyright)}</span>
      <div class="social-links">${links}</div>
    `;
  }

  function renderAll() {
    renderHeader();
    document.getElementById('app-sections').innerHTML =
            renderAbout() + renderProjects() + renderGames() + renderSkills() + renderContact();
    renderFooter();
    initEffects();
    setMode('skim');
  }

  // Cursor dot + expand/collapse + scroll fade-in
  function toggle(trigger) {
    trigger.classList.toggle('open');
    const content = trigger.nextElementSibling;
    if (content && content.classList.contains('expand-content')) {
      content.classList.toggle('open');
    }
  }

  const MODE_HINTS = {
    skim: "Compact view — click any underlined term for the full story.",
    dig: "Everything's expanded — the how, not just the what."
  };

  function setMode(mode) {
    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.mode === mode);
    });
    const hint = document.getElementById('mode-hint');
    if (hint) hint.textContent = MODE_HINTS[mode] || '';

    const shouldOpen = mode === 'dig';
    document.querySelectorAll('.expand-trigger').forEach(trigger => {
      trigger.classList.toggle('open', shouldOpen);
      const content = trigger.nextElementSibling;
      if (content && content.classList.contains('expand-content')) {
        content.classList.toggle('open', shouldOpen);
      }
    });
  }

  function initEffects() {
    const dot = document.getElementById('dot');
    document.addEventListener('mousemove', e => {
      dot.style.left = e.clientX + 'px';
      dot.style.top  = e.clientY + 'px';
    });

    const sections = document.querySelectorAll('#app-sections section');
    sections.forEach((s, i) => {
      s.style.animationDelay = `${0.1 * (i + 1)}s`;
    });

    const observer = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.style.opacity = 1;
          e.target.style.transform = 'translateY(0)';
        }
      });
    }, { threshold: 0.1 });

    sections.forEach(s => {
      s.style.opacity = 0;
      s.style.transform = 'translateY(16px)';
      s.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
      observer.observe(s);
    });
  }

  renderAll();
</script>
</body>
</html>
